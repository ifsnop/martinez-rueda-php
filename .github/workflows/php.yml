name: PHP Composer

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    # Versiones fijas: ubuntu-latest cambia de PHP sin avisar (pasó de 8.3 a 8.5).
    # 8.3 = entorno de desarrollo actual; 8.5 = la más reciente.
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.3', '8.5' ]

    steps:
    - uses: actions/checkout@v4

    - name: Set up PHP ${{ matrix.php }}
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}
        extensions: dom, mbstring, xmlwriter
        coverage: none
        tools: composer

    - name: Validate composer.json and composer.lock
      run: composer validate --strict

    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v3
      with:
        path: vendor
        key: ${{ runner.os }}-php${{ matrix.php }}-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php${{ matrix.php }}-

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    - name: Run PHPUnit
      run: vendor/bin/phpunit

    - name: Custom tests
      run: php tests.php

    # No bloqueante mientras queden errores de PHPStan (ISSUES.md, punto 9).
    # Cuando el análisis quede limpio, quitar "continue-on-error".
    - name: PHPStan
      run: vendor/bin/phpstan analyse --no-progress --error-format=github
      continue-on-error: true

    # Add a test script to composer.json, for instance: "test": "vendor/bin/phpunit"
    # Docs: https://getcomposer.org/doc/articles/scripts.md

    # - name: Run test suite
    #   run: composer run-script test
